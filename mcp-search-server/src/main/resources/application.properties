spring.application.name=mcp-search-server

# stdout belongs to the MCP protocol: no web server, no banner, no console logging.
# Any other output on stdout breaks the connection to the client.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.pattern.console=
logging.file.name=${java.io.tmpdir}/mcp-search-server.log

spring.ai.mcp.server.name=custom-web-search
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.stdio=true

searxng.url=${SEARXNG_URL:http://localhost:8888}
