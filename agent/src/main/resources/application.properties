spring.application.name=agent
spring.threads.virtual.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# We call ChatModel directly. With three ChatModel beans the auto-configured
# ChatClient.Builder cannot resolve its single ChatModel parameter and startup fails.
spring.ai.chat.client.enabled=false

# Upper bound of concurrent calls per provider. The free Gemini tier is tight, hence 2.
agent.llm.concurrency.limits.openai=8
agent.llm.concurrency.limits.anthropic=4
agent.llm.concurrency.limits.google=2

# Spring AI has no timeout for Google GenAI, see GoogleGenAiClientConfiguration.
# Applies per attempt; the client retries with growing pauses on top.
agent.llm.google.timeout=60s

# GAIA experiment. The dataset is gated, HF_TOKEN must belong to an account that accepted its terms.
agent.gaia.hf-token=${HF_TOKEN:}
agent.gaia.split=2023_level1
agent.gaia.problem-count=5
agent.gaia.models=google/gemini-3.6-flash

# Web search tool (chapter 3): local SearXNG, started with "docker compose up -d".
agent.searxng.url=${SEARXNG_URL:http://localhost:8888}

# Embeddings (chapter 5): our own Gemini EmbeddingModel in EmbeddingConfiguration. Both
# auto-configurations stay off; OpenAI's would add a second EmbeddingModel bean.
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
agent.llm.embedding.model=gemini-embedding-001

# Model that reads images, audio and PDF for readMediaFile (chapter 5).
agent.media.model=google/gemini-3.6-flash

# Attachments of GAIA tasks, downloaded once (chapter 5). The dataset terms forbid sharing
# them, so the folder is in .gitignore.
agent.gaia.cache-dir=.gaia-cache
